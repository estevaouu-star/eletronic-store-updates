name: Publicar Eletromix 10.9.5
on:
  push:
    branches: [main]
    paths: ['release-v10.9.5-trigger.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair fonte
        shell: pwsh
        run: Expand-Archive -Path "Eletromix-v10.1.0-source-for-release.zip" -DestinationPath app
      - name: Aplicar patches
        shell: pwsh
        run: |
          python scripts/apply-v10.2.py
          python scripts/fix-v10.2-types.py
          python scripts/apply-v10.3.py
          python scripts/apply-v10.4.py
          python scripts/apply-v10.5.py
          python scripts/apply-v10.7.py
          python scripts/apply-v10.7.1.py
          python scripts/apply-v10.7.2.py
          python scripts/apply-v10.7.3.py
          python scripts/apply-v10.7.4.py
          python scripts/apply-v10.7.5.py
          python scripts/apply-v10.7.6.py
          python scripts/apply-v10.7.7.py
          python scripts/apply-v10.7.8.py
          python scripts/apply-v10.7.9.py
          python scripts/apply-v10.8.0.py
          python scripts/apply-v10.8.1.py
          python scripts/apply-v10.8.2.py
          python scripts/apply-v10.8.3.py
          python scripts/apply-v10.8.4.py
          python scripts/fix-v10.8.4-types.py
          python scripts/apply-v10.8.5.py
          python scripts/apply-v10.9.0.py
          python scripts/apply-v10.9.1.py
          python scripts/apply-v10.9.2.py
          python scripts/apply-v10.9.3.py
          python scripts/apply-v10.9.4.py
          python scripts/apply-v10.9.5.py
      - name: Aplicar ícone
        shell: pwsh
        run: python -c "import base64,pathlib; data=base64.b64decode(''.join(pathlib.Path(f'assets/eletromix-icon-256.part{i}').read_text().strip() for i in range(1,7))); pathlib.Path('app/electron/assets/icon.png').write_bytes(data); pathlib.Path('app/public/eletromix-app-icon.png').write_bytes(data)"
      - name: Validar 10.9.5
        shell: pwsh
        run: |
          node --check app/public/app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check app/electron/main.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path 'app/public/index.html' -Pattern 'openCheckout' -SimpleMatch -Quiet)) { throw 'Botao COBRAR abaixo do total ausente' }
          if (-not (Select-String -Path 'app/public/index.html' -Pattern 'checkoutFloat' -SimpleMatch -Quiet)) { throw 'Menu flutuante de pagamento ausente' }
          if (-not (Select-String -Path 'app/public/app.js' -Pattern 'Selecione o vendedor antes de iniciar a venda.' -SimpleMatch -Quiet)) { throw 'Bloqueio por vendedor ausente' }
          if (-not (Select-String -Path 'app/public/index.html' -Pattern 'filtroInfoProdutoBtn' -SimpleMatch -Quiet)) { throw 'Botao Faltando informacao ausente' }
          if (-not (Select-String -Path 'app/public/app.js' -Pattern 'produtoTemInformacaoFaltando' -SimpleMatch -Quiet)) { throw 'Filtro Faltando informacao nao funcional' }
          if (-not (Select-String -Path 'app/public/app.js' -Pattern 'const produtosPorPagina=25' -SimpleMatch -Quiet)) { throw 'Produtos nao estao em 25 por pagina' }
      - name: Instalar e compilar
        working-directory: app
        run: |
          npm install
          npm run build
      - name: Gerar instalador
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish never
      - name: Publicar com repetição automática
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference='Continue'
          gh release delete v10.9.5 --yes 2>$null
          git push origin --delete v10.9.5 2>$null
          $created=$false
          for($i=1;$i -le 8;$i++){
            gh release create v10.9.5 --target main --title "Eletromix 10.9.5 - Fluxo de cobrança" --notes "COBRAR abaixo do total, pagamento em menu flutuante, vendedor obrigatório antes de iniciar a venda e correção do botão Faltando informação em Produtos. Mantidos 25 produtos por página."
            if($LASTEXITCODE -eq 0){$created=$true;break}
            Start-Sleep -Seconds (5*$i)
          }
          if(-not $created){throw 'Nao foi possivel criar a release'}
          Get-ChildItem app/release -File | Where-Object { $_.Name -match '\.(exe|yml|blockmap)$' } | ForEach-Object {
            $sent=$false
            for($i=1;$i -le 8;$i++){
              gh release upload v10.9.5 $_.FullName --clobber
              if($LASTEXITCODE -eq 0){$sent=$true;break}
              Start-Sleep -Seconds (5*$i)
            }
            if(-not $sent){throw "Falha no upload: $($_.Name)"}
          }
