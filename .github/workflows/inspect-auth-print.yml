name: Inspecionar login e impressão
on:
  push:
    branches: [main]
    paths: ['inspect-auth-print-trigger.txt']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Montar fonte atual
        run: |
          rm -rf app
          unzip -q Eletromix-v10.1.0-source-for-release.zip -d app
          python scripts/apply-v10.2.py
          python scripts/fix-v10.2-types.py
          python scripts/apply-v10.3.py
          python scripts/apply-v10.4.py
          python scripts/apply-v10.5.py
          python scripts/apply-v10.7.py
          python scripts/apply-v10.7.1.py
          python scripts/apply-v10.7.2.py
          python scripts/apply-v10.7.3.py
          python scripts/apply-v10.7.4.py
          python scripts/apply-v10.7.5.py
          python scripts/apply-v10.7.6.py
          python scripts/apply-v10.7.7.py
          python scripts/apply-v10.7.8.py
          python scripts/apply-v10.7.9.py
          python scripts/apply-v10.8.0.py
          python scripts/apply-v10.8.1.py
      - name: Mapear arquivos
        run: |
          echo '===== FILES ====='
          find app -maxdepth 3 -type f | sort | head -120
      - name: Procurar login usuários e autenticação
        run: |
          echo '===== AUTH SEARCH ====='
          grep -RniE 'login|senha|password|usuario|usuário|admin|auth|sess[aã]o|bcrypt|jwt' app/src app/public app/server* app 2>/dev/null | head -300 || true
      - name: Procurar impressão
        run: |
          echo '===== PRINT SEARCH ====='
          grep -RniE 'directPrintReceipt|desktopPrinter|printer:print|imprimir|receiptPrintPayload|print\(' app/public app/electron 2>/dev/null | head -260 || true
      - name: Mostrar servidor principal e schema
        run: |
          echo '===== PACKAGE ====='; cat app/package.json
          for f in app/src/server.ts app/src/index.ts app/server.ts app/server.js app/src/db.ts app/src/database.ts app/prisma/schema.prisma; do if [ -f "$f" ]; then echo "===== $f ====="; sed -n '1,260p' "$f"; fi; done
