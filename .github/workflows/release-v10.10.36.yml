name: Publicar Eletromix 10.10.36
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: eletromix-release-10-10-36
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair fonte
        shell: pwsh
        run: Expand-Archive -Path "Eletromix-v10.1.0-source-for-release.zip" -DestinationPath app
      - name: Aplicar patches em ordem
        shell: pwsh
        run: |
          $files = @('apply-v10.2.py','fix-v10.2-types.py','apply-v10.3.py','apply-v10.4.py','apply-v10.5.py','apply-v10.7.py','apply-v10.7.1.py','apply-v10.7.2.py','apply-v10.7.3.py','apply-v10.7.4.py','apply-v10.7.5.py','apply-v10.7.6.py','apply-v10.7.7.py','apply-v10.7.8.py','apply-v10.7.9.py','apply-v10.8.0.py','apply-v10.8.1.py','apply-v10.8.2.py','apply-v10.8.3.py','apply-v10.8.4.py','fix-v10.8.4-types.py','apply-v10.8.5.py','apply-v10.9.0.py','apply-v10.9.1.py','apply-v10.9.2.py','apply-v10.9.3.py','apply-v10.9.4.py','apply-v10.9.5.py','apply-v10.9.6.py','apply-v10.9.7.py','apply-v10.9.8.py','apply-v10.9.9.py','apply-v10.10.0.py','apply-v10.10.1.py','apply-v10.10.2.py','apply-v10.10.3.py','apply-v10.10.4.py','apply-v10.10.5.py','apply-v10.10.6.py','apply-v10.10.7.py','apply-v10.10.8.py','apply-v10.10.8-fix.py','apply-v10.10.9.py','apply-v10.10.10.py','apply-v10.10.11.py','apply-v10.10.12.py','apply-v10.10.13.py','apply-v10.10.14.py','apply-v10.10.15.py','apply-v10.10.16.py','apply-v10.10.17.py','apply-v10.10.18.py','apply-v10.10.19.py','apply-v10.10.20.py','apply-v10.10.21.py','apply-v10.10.22.py','apply-v10.10.23.py','apply-v10.10.24.py','apply-v10.10.25.py','apply-v10.10.26.py','apply-v10.10.27.py','apply-v10.10.28.py','apply-v10.10.29.py','apply-v10.10.30.py','apply-v10.10.31.py','apply-v10.10.32.py','apply-v10.10.33.py','apply-v10.10.34.py','apply-v10.10.35.py','apply-v10.10.36.py')
          foreach($file in $files){ python "scripts/$file"; if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE } }
      - name: Validar fluxo de OS e sincronização econômica
        shell: pwsh
        run: |
          node --check app/public/app.js
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $pkg=Get-Content app/package.json -Raw | ConvertFrom-Json
          if($pkg.version -ne '10.10.36'){throw 'Versão final incorreta'}
          if(-not (Select-String -Path app/public/app.js -Pattern 'A definir após diagnóstico' -SimpleMatch -Quiet)){throw 'Valor indefinido da OS não foi aplicado'}
          if(-not (Select-String -Path app/public/app.js -Pattern 'Acabou de chegar' -SimpleMatch -Quiet)){throw 'Novos status da OS não foram aplicados'}
          if(-not (Select-String -Path app/public/app.js -Pattern 'Técnico concluiu — iniciar garantia' -SimpleMatch -Quiet)){throw 'Ação de início da garantia não foi aplicada'}
          if(-not (Select-String -Path app/public/app.js -Pattern 'Ordem finalizada #${id}' -SimpleMatch -Quiet)){throw 'Tela bloqueada de OS finalizada não foi aplicada'}
          if(-not (Select-String -Path app/public/app.js -Pattern 'Ver via do cliente' -SimpleMatch -Quiet)){throw 'Pré-visualização das vias não foi aplicada'}
          if(-not (Select-String -Path app/src/server.ts -Pattern 'OS_FINALIZADA_101036' -SimpleMatch -Quiet)){throw 'Bloqueio de edição no servidor não foi aplicado'}
          if(-not (Select-String -Path app/public/app.js -Pattern 'SYNC_MANUAL_101034' -SimpleMatch -Quiet)){throw 'Sincronização manual econômica não foi preservada'}
          if(-not (Select-String -Path app/public/app.js -Pattern '50% do valor do serviço autorizado' -SimpleMatch -Quiet)){throw 'Termo da via da loja não foi preservado'}
      - name: Aplicar ícone
        shell: pwsh
        run: python -c "import base64,pathlib; data=base64.b64decode(''.join(pathlib.Path(f'assets/eletromix-icon-256.part{i}').read_text().strip() for i in range(1,7))); pathlib.Path('app/electron/assets/icon.png').write_bytes(data); pathlib.Path('app/public/eletromix-app-icon.png').write_bytes(data)"
      - name: Instalar e compilar
        working-directory: app
        run: |
          npm install
          npm run build
      - name: Gerar instalador
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish never
      - name: Publicar release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v10.10.36 --yes 2>$null
          gh release create v10.10.36 --target main --title "Eletromix 10.10.36 - Fluxo de Ordens de Serviço" --notes "Ordens de Serviço agora aceitam diagnóstico sem serviço e sem preço definido, exibindo 'A definir após diagnóstico' em vez de R$ 0,00. Status simplificados para Acabou de chegar, Esperando técnico consertar, Pago e Finalizado. A garantia começa somente quando o técnico confirma a conclusão do reparo. Após Finalizado, a OS fica bloqueada para edição e permanece disponível para consulta das vias do cliente, loja e garantia sem precisar imprimir. Mantém a sincronização econômica e o termo de autorização da via da loja." app/release/*.exe app/release/*.yml app/release/*.blockmap
