name: Publicar Eletromix 10.8.0
on:
  push:
    branches: [main]
    paths: ['release-v10.8.0-trigger.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Extrair fonte
        shell: pwsh
        run: |
          if (Test-Path app) { Remove-Item app -Recurse -Force }
          Expand-Archive -Path "Eletromix-v10.1.0-source-for-release.zip" -DestinationPath app
      - name: Aplicar atualizações
        shell: pwsh
        run: |
          python scripts/apply-v10.2.py
          python scripts/fix-v10.2-types.py
          python scripts/apply-v10.3.py
          python scripts/apply-v10.4.py
          python scripts/apply-v10.5.py
          python scripts/apply-v10.7.py
          python scripts/apply-v10.7.1.py
          python scripts/apply-v10.7.2.py
          python scripts/apply-v10.7.3.py
          python scripts/apply-v10.7.4.py
          python scripts/apply-v10.7.5.py
          python scripts/apply-v10.7.6.py
          python scripts/apply-v10.7.7.py
          python scripts/apply-v10.7.8.py
          python scripts/apply-v10.7.9.py
          python scripts/apply-v10.8.0.py
      - name: Aplicar ícone Eletromix validado
        shell: pwsh
        run: |
          python -c "import base64,pathlib,hashlib,struct; parts=[pathlib.Path(f'assets/eletromix-icon-256.part{i}').read_text(encoding='utf-8').strip() for i in range(1,7)]; data=base64.b64decode(''.join(parts),validate=True); assert hashlib.sha256(data).hexdigest()=='590c99ce1b57214450b83c375377f6bff1092d9615d5e224803b2a56da7d1617'; w,h=struct.unpack('>II',data[16:24]); assert (w,h)==(256,256); pathlib.Path('app/electron/assets/icon.png').write_bytes(data); pathlib.Path('app/public/eletromix-app-icon.png').write_bytes(data)"
      - name: Verificar melhorias da impressão 10.8
        shell: pwsh
        run: |
          node --check app/public/app.js
          node --check app/electron/main.cjs
          node --check app/electron/preload.cjs
          if (-not (Select-String -Path app/electron/main.cjs -Pattern '0x1d,0x56,0x42,0x00' -Quiet)) { throw 'Comando de corte automático ausente' }
          if (-not (Select-String -Path app/electron/main.cjs -Pattern 'RawPrinterFast' -Quiet)) { throw 'Worker persistente de impressão ausente' }
          if (-not (Select-String -Path app/electron/main.cjs -Pattern 'ensureRawPrinterWorker' -Quiet)) { throw 'Pré-aquecimento da impressão ausente' }
          if (-not (Select-String -Path app/electron/main.cjs -Pattern 'threshold=142' -Quiet)) { throw 'Densidade térmica otimizada ausente' }
          if (-not (Select-String -Path app/electron/main.cjs -Pattern 'contrast\(\.25\) brightness\(1\.35\)' -Quiet)) { throw 'Tratamento da logo ausente' }
          if (-not (Select-String -Path app/electron/main.cjs -Pattern 'getThermalRenderWindow' -Quiet)) { throw 'Janela de renderização reutilizável ausente' }
      - name: Instalar dependências
        working-directory: app
        run: npm install
      - name: Compilar backend
        working-directory: app
        run: npm run build
      - name: Gerar instalador
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish never
      - name: Publicar Release 10.8.0
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "v10.8.0" --yes 2>$null
          git push origin --delete "v10.8.0" 2>$null
          gh release create "v10.8.0" --target main --title "Eletromix 10.8.0 - Impressão térmica otimizada" --notes "Melhora o modo térmico direto: adiciona comando ESC/POS de corte automático ao final do comprovante, reduz a carga escura da logo para melhorar a leitura e economizar a cabeça térmica, e acelera a impressão mantendo o spooler RAW e a janela de renderização prontos entre uma impressão e outra. Mantém o comprimento econômico corrigido nas versões anteriores."
          Get-ChildItem app/release -File | Where-Object { $_.Name -match '\.(exe|yml|blockmap)$' } | ForEach-Object { gh release upload "v10.8.0" $_.FullName --clobber }
