name: Publicar Eletromix 10.10.31
on:
  push:
    branches: [main]
    paths: ['release-v10.10.31-trigger.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair e aplicar patches
        shell: pwsh
        run: |
          Expand-Archive -Path "Eletromix-v10.1.0-source-for-release.zip" -DestinationPath app
          $files = @('apply-v10.2.py','fix-v10.2-types.py','apply-v10.3.py','apply-v10.4.py','apply-v10.5.py','apply-v10.7.py','apply-v10.7.1.py','apply-v10.7.2.py','apply-v10.7.3.py','apply-v10.7.4.py','apply-v10.7.5.py','apply-v10.7.6.py','apply-v10.7.7.py','apply-v10.7.8.py','apply-v10.7.9.py','apply-v10.8.0.py','apply-v10.8.1.py','apply-v10.8.2.py','apply-v10.8.3.py','apply-v10.8.4.py','fix-v10.8.4-types.py','apply-v10.8.5.py','apply-v10.9.0.py','apply-v10.9.1.py','apply-v10.9.2.py','apply-v10.9.3.py','apply-v10.9.4.py','apply-v10.9.5.py','apply-v10.9.6.py','apply-v10.9.7.py','apply-v10.9.8.py','apply-v10.9.9.py','apply-v10.10.0.py','apply-v10.10.1.py','apply-v10.10.2.py','apply-v10.10.3.py','apply-v10.10.4.py','apply-v10.10.5.py','apply-v10.10.6.py','apply-v10.10.7.py','apply-v10.10.8.py','apply-v10.10.8-fix.py','apply-v10.10.9.py','apply-v10.10.10.py','apply-v10.10.11.py','apply-v10.10.12.py','apply-v10.10.13.py','apply-v10.10.14.py','apply-v10.10.15.py','apply-v10.10.16.py','apply-v10.10.17.py','apply-v10.10.18.py','apply-v10.10.19.py','apply-v10.10.20.py','apply-v10.10.21.py','apply-v10.10.22.py','apply-v10.10.23.py','apply-v10.10.24.py','apply-v10.10.25.py','apply-v10.10.26.py','apply-v10.10.27.py','apply-v10.10.28.py','apply-v10.10.29.py','apply-v10.10.30.py','apply-v10.10.31.py')
          foreach($file in $files){ python "scripts/$file"; if($LASTEXITCODE -ne 0){exit $LASTEXITCODE} }
      - name: Validar correções
        shell: pwsh
        run: |
          node --check app/public/app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if(-not (Select-String -Path app/public/app.js -Pattern '// 10.10.31 - restaura cancelar/excluir venda e deixa o cliente da OS como nome digitado livremente.' -SimpleMatch -Quiet)){throw 'Patch 10.10.31 não foi aplicado'}
          if(-not (Select-String -Path app/public/app.js -Pattern 'placeholder="Digite o nome do cliente"' -SimpleMatch -Quiet)){throw 'Campo livre de cliente na OS ausente'}
          if(-not (Select-String -Path app/public/app.js -Pattern 'onclick="cancelVenda(${v.id})"' -SimpleMatch -Quiet)){throw 'Cancelar venda ausente'}
          if(-not (Select-String -Path app/public/app.js -Pattern 'onclick="deleteVenda(${v.id})"' -SimpleMatch -Quiet)){throw 'Excluir venda ausente'}
          $pkg=Get-Content app/package.json -Raw | ConvertFrom-Json
          if($pkg.version -ne '10.10.31'){throw 'Versão incorreta'}
      - name: Aplicar ícone
        shell: pwsh
        run: python -c "import base64,pathlib; data=base64.b64decode(''.join(pathlib.Path(f'assets/eletromix-icon-256.part{i}').read_text().strip() for i in range(1,7))); pathlib.Path('app/electron/assets/icon.png').write_bytes(data); pathlib.Path('app/public/eletromix-app-icon.png').write_bytes(data)"
      - name: Instalar e compilar
        working-directory: app
        run: |
          npm install
          npm run build
      - name: Gerar instalador
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish never
      - name: Publicar versão
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v10.10.31 --yes --cleanup-tag 2>$null
          gh release create v10.10.31 --target main --title "Eletromix 10.10.31 - Vendas e Cliente da OS" --notes "Restaura as ações Cancelar e Excluir no histórico de vendas e altera o campo Cliente da nova ordem de serviço para digitação livre do nome, sem seleção de cliente cadastrado. Mantém as melhorias da garantia e impressão da versão anterior." app/release/*.exe app/release/*.yml app/release/*.blockmap
