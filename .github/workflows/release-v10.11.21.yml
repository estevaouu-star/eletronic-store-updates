name: Publicar Eletromix 10.11.21 em Releases
on:
  push:
    branches: [main]
    paths: ['release-10.11.21-trigger.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair e aplicar patches
        shell: pwsh
        run: |
          Expand-Archive -Path "Eletromix-v10.1.0-source-for-release.zip" -DestinationPath app
          $wf = Get-Content '.github/workflows/release-v10.10.51.yml' -Raw
          $m = [regex]::Match($wf, '\$base\s*=\s*@\((.*?)\)', [System.Text.RegularExpressions.RegexOptions]::Singleline)
          if(-not $m.Success){ throw 'Lista base nao encontrada' }
          $files = [regex]::Matches($m.Groups[1].Value, "'([^']+)'\s*,?") | ForEach-Object {$_.Groups[1].Value}
          foreach($file in $files){python "scripts/$file";if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}}
          foreach($file in @('apply-v10.10.52.py','apply-v10.11.00.py','apply-v10.11.01.py','apply-v10.11.02.py','apply-v10.11.03.py','apply-v10.11.04.py','apply-v10.11.05.py','apply-v10.11.06.py','apply-v10.11.07.py','apply-v10.11.08.py','apply-v10.11.09.py','apply-v10.11.10.py','apply-v10.11.11.py','apply-v10.11.12.py','apply-v10.11.13.py','apply-v10.11.14.py','apply-v10.11.15.py','apply-v10.11.16.py','apply-v10.11.17.py','apply-v10.11.18.py','apply-v10.11.19.py','apply-v10.11.20.py','apply-v10.11.21.py')){python "scripts/$file";if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}}
      - name: Aplicar icone
        shell: pwsh
        run: python -c "import base64,pathlib; data=base64.b64decode(''.join(pathlib.Path(f'assets/eletromix-icon-256.part{i}').read_text().strip() for i in range(1,7))); pathlib.Path('app/electron/assets/icon.png').write_bytes(data); pathlib.Path('app/public/eletromix-app-icon.png').write_bytes(data)"
      - name: Validar comprovante ELGIN i8 alinhado
        shell: pwsh
        run: |
          node --check app/public/app.js
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          node --check app/electron/main.cjs
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $pkg=Get-Content app/package.json -Raw | ConvertFrom-Json
          if($pkg.version -ne '10.11.21'){throw 'Versão incorreta'}
          if(-not (Select-String app/electron/main.cjs -Pattern 'windows-elgin-i8-aligned' -SimpleMatch -Quiet)){throw 'Modo alinhado da ELGIN i8 ausente'}
          if(Select-String app/electron/main.cjs -Pattern 'return await printElginI8GdiWindows' -SimpleMatch -Quiet){throw 'Desvio PowerShell ainda ativo'}
          if(-not (Select-String app/electron/main.cjs -Pattern 'width:64mm!important' -SimpleMatch -Quiet)){throw 'Área segura de 64 mm ausente'}
          if(-not (Select-String app/electron/main.cjs -Pattern 'th:last-child' -SimpleMatch -Quiet)){throw 'Alinhamento de valores ausente'}
          if(-not (Select-String app/electron/main.cjs -Pattern 'isVirtualPrinter101113' -SimpleMatch -Quiet)){throw 'Filtro virtual ausente'}
      - name: Compilar e gerar instalador
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install
          npm run build
          npx electron-builder --win nsis --publish never
      - name: Publicar
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v10.11.21 --yes 2>$null
          gh release create v10.11.21 --target main --title "Eletromix 10.11.21 - comprovante ELGIN i8 alinhado" --notes "Mantém o driver ELGIN i8 funcional e corrige largura, alinhamento, legibilidade e rodapé duplicado do comprovante." app/release/*.exe app/release/*.yml app/release/*.blockmap
          gh release edit v10.11.21 --latest
