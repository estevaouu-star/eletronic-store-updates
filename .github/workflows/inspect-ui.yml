name: Inspecionar estrutura UI
on:
  push:
    branches: [main]
    paths: ['inspect-trigger.txt']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair base e aplicar ate 10.7.2
        run: |
          unzip -q Eletromix-v10.1.0-source-for-release.zip -d app
          python scripts/apply-v10.2.py
          python scripts/fix-v10.2-types.py
          python scripts/apply-v10.3.py
          python scripts/apply-v10.4.py
          python scripts/apply-v10.5.py
          python scripts/apply-v10.7.py
          python scripts/apply-v10.7.1.py
          python scripts/apply-v10.7.2.py
      - name: Mostrar estrutura Caixa e estoque
        run: |
          echo '=== CAIXA HTML ==='
          sed -n '35,120p' app/public/index.html
          echo '=== REFERENCIAS LISTAS ==='
          grep -niE 'listaProdutos|listaServicos|Produtos|Serviços|Servicos' app/public/index.html | head -n 100 || true
          echo '=== ADD CART / RENDER PRODUTOS ==='
          grep -niE 'addCart|renderCaixa|render.*Produto|estoque<=0|estoque===0|Sem estoque|Adicionar' app/public/app.js | head -n 220 || true
          echo '=== ENDPOINT ESTOQUE ==='
          grep -niE 'produtos/.*/estoque|estoque.*auth|app.post.*estoque' app/src/server.ts | head -n 100 || true
