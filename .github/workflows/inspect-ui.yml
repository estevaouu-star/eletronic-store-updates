name: Inspecionar estrutura UI
on:
  push:
    branches: [main]
    paths: ['inspect-trigger.txt']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair base e aplicar ate 10.7.3
        run: |
          unzip -q Eletromix-v10.1.0-source-for-release.zip -d app
          python scripts/apply-v10.2.py
          python scripts/fix-v10.2-types.py
          python scripts/apply-v10.3.py
          python scripts/apply-v10.4.py
          python scripts/apply-v10.5.py
          python scripts/apply-v10.7.py
          python scripts/apply-v10.7.1.py
          python scripts/apply-v10.7.2.py
          python scripts/apply-v10.7.3.py
      - name: Mostrar troca de loja e aparência
        run: |
          echo '=== LOJA / TROCA DE LOJA ==='
          grep -niE 'lojaId|storeSelect|lojaSelect|select.*loja|lojaAtual|currentStore|X-Store-Id|loadLojas' app/public/app.js | head -n 260 || true
          echo '=== HTML HEADER LOJA ==='
          grep -niE -A8 -B8 'loja|store' app/public/index.html | head -n 180 || true
          echo '=== TIPO APARENCIA ==='
          grep -niE -A30 -B10 'type Aparencia|interface Aparencia' app/src/server.ts | head -n 120 || true
