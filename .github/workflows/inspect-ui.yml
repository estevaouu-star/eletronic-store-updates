name: Inspecionar estrutura UI
on:
  push:
    branches: [main]
    paths: ['inspect-trigger.txt']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair base e aplicar ate 10.7.5
        run: |
          unzip -q Eletromix-v10.1.0-source-for-release.zip -d app
          python scripts/apply-v10.2.py
          python scripts/fix-v10.2-types.py
          python scripts/apply-v10.3.py
          python scripts/apply-v10.4.py
          python scripts/apply-v10.5.py
          python scripts/apply-v10.7.py
          python scripts/apply-v10.7.1.py
          python scripts/apply-v10.7.2.py
          python scripts/apply-v10.7.3.py
          python scripts/apply-v10.7.4.py
          python scripts/apply-v10.7.5.py
      - name: Mostrar fluxo completo de impressão
        run: |
          echo '=== FRONTEND IMPRESSAO ==='
          grep -niE -A45 -B25 'directPrintReceipt|printReceipt|printerSelect|printerWidth|printerAuto|refreshPrinters|testPrinter|window\.electron|ipc|print' app/public/app.js | head -n 1400 || true
          echo '=== HTML CONFIG IMPRESSORA ==='
          grep -niE -A50 -B20 'printer|impress|bobina|58|80' app/public/index.html | head -n 700 || true
          echo '=== ELECTRON MAIN/PRELOAD ==='
          find app/electron -maxdepth 3 -type f -print
          grep -RniE -A50 -B20 'print|printer|getPrinters|ipcMain|ipcRenderer|webContents' app/electron | head -n 1600 || true
          echo '=== PACKAGE ==='
          cat app/package.json
          echo '=== CSS RECIBO / PRINT ==='
          grep -niE -A40 -B20 '@media print|receipt|print' app/public/style.css | head -n 700 || true
