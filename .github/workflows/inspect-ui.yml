name: Inspecionar estrutura UI
on:
  push:
    branches: [main]
    paths: ['inspect-trigger.txt']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair base e aplicar ate 10.7.4
        run: |
          unzip -q Eletromix-v10.1.0-source-for-release.zip -d app
          python scripts/apply-v10.2.py
          python scripts/fix-v10.2-types.py
          python scripts/apply-v10.3.py
          python scripts/apply-v10.4.py
          python scripts/apply-v10.5.py
          python scripts/apply-v10.7.py
          python scripts/apply-v10.7.1.py
          python scripts/apply-v10.7.2.py
          python scripts/apply-v10.7.3.py
          python scripts/apply-v10.7.4.py
      - name: Mostrar personalização completa
        run: |
          echo '=== HTML PERSONALIZACAO ==='
          sed -n '195,270p' app/public/index.html || true
          echo '=== JS APARENCIA / LOGOS / UPLOAD ==='
          grep -niE -A35 -B15 'loadAparencia|loadAppearanceForm|saveAparencia|logoDataUrl|logoComprovante|650|FileReader|appearanceForm|aparenciaForm|preset' app/public/app.js | head -n 900 || true
          echo '=== SERVER APARENCIA ==='
          grep -niE -A45 -B20 '/api/aparencia|type Aparencia|aparenciaPorLoja|aparencia' app/src/server.ts | head -n 700 || true
          echo '=== CSS LOGOS ==='
          grep -niE -A25 -B10 'brand-logo|logo-upload|logo-preview|appearance|preset|system-icon' app/public/style.css | head -n 600 || true
