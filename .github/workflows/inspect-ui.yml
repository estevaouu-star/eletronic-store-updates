name: Inspecionar estrutura UI
on:
  push:
    branches: [main]
    paths: ['inspect-trigger.txt']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair base e aplicar ate 10.7.3
        run: |
          unzip -q Eletromix-v10.1.0-source-for-release.zip -d app
          python scripts/apply-v10.2.py
          python scripts/fix-v10.2-types.py
          python scripts/apply-v10.3.py
          python scripts/apply-v10.4.py
          python scripts/apply-v10.5.py
          python scripts/apply-v10.7.py
          python scripts/apply-v10.7.1.py
          python scripts/apply-v10.7.2.py
          python scripts/apply-v10.7.3.py
      - name: Mostrar personalizacao e logos
        run: |
          echo '=== PERSONALIZACAO HTML ==='
          grep -n -A90 -B10 'id="personalizacao"' app/public/index.html || true
          echo '=== LOGOS / APARENCIA JS ==='
          grep -niE 'logoDataUrl|aparencia|personaliza|tema|preset|corPrimaria|accent|logo' app/public/app.js | head -n 320 || true
          echo '=== PERSONALIZACAO CSS ==='
          grep -niE 'personal|theme|tema|preset|swatch|color|accent|logo' app/public/style.css | head -n 320 || true
          echo '=== PACKAGE BUILD ICON ==='
          cat app/package.json
