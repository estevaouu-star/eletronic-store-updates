name: Inspecionar estrutura UI
on:
  push:
    branches: [main]
    paths: ['inspect-trigger.txt']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair base e aplicar ate 10.7
        run: |
          unzip -q Eletromix-v10.1.0-source-for-release.zip -d app
          python scripts/apply-v10.2.py
          python scripts/fix-v10.2-types.py
          python scripts/apply-v10.3.py
          python scripts/apply-v10.4.py
          python scripts/apply-v10.5.py
          python scripts/apply-v10.7.py
      - name: Mostrar header, atualizador e estilos
        run: |
          echo '=== HEADER ==='
          sed -n '1,45p' app/public/index.html
          echo '=== CONFIG ==='
          sed -n '270,360p' app/public/index.html
          echo '=== UPDATE REFERENCES HTML ==='
          grep -niE 'atualiz|update|vers[aã]o|version|gest[aã]o inteligente|Eletromix' app/public/index.html | head -n 160 || true
          echo '=== UPDATE REFERENCES JS ==='
          grep -niE 'atualiz|update|vers[aã]o|version|latest|electron|ipc' app/public/app.js | head -n 220 || true
          echo '=== STYLE HEAD/HEADER ==='
          grep -niE 'header|brand|logo|update|version|topbar|card|nav|section|body|main' app/public/style.css | head -n 260 || true
