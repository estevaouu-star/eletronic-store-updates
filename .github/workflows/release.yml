name: Publicar atualização Eletromix
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Baixar versão-base
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/estevaouu-star/eletronic-store-updates/releases/download/v10.0.1/Eletromix-Base-v10.0.1.zip" -OutFile base.zip
          Expand-Archive base.zip -DestinationPath app
      - name: Baixar patch
        uses: actions/checkout@v4
        with:
          path: updates
      - name: Aplicar atualização
        run: node updates/scripts/apply-update.js app
      - name: Instalar dependências
        working-directory: app
        run: npm install
      - name: Gerar instalador e latest.yml
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish never
      - name: Publicar Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v10.1.0" --title "Eletromix 10.1.0 — Pagamento misto" --notes "Pagamento dividido entre PIX, Dinheiro, Débito e Crédito. Permite usar de 2 a 4 formas na mesma venda." 2>$null
          Get-ChildItem app/release -File | Where-Object { $_.Name -match '\.(exe|yml|blockmap)$' } | ForEach-Object { gh release upload "v10.1.0" $_.FullName --clobber }
