name: Publicar atualização Eletromix
on:
  push:
    branches:
      - main
    paths:
      - 'release-trigger.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Extrair fonte 10.1.0
        shell: pwsh
        run: |
          if (Test-Path app) { Remove-Item app -Recurse -Force }
          Expand-Archive -Path "Eletromix-v10.1.0-source-for-release.zip" -DestinationPath app
      - name: Aplicar atualização 10.2.0
        run: python scripts/apply-v10.2.py
      - name: Corrigir tipos 10.2.0
        run: python scripts/fix-v10.2-types.py
      - name: Aplicar atualização 10.3.0
        run: python scripts/apply-v10.3.py
      - name: Aplicar atualização 10.4.0
        run: python scripts/apply-v10.4.py
      - name: Aplicar atualização 10.5.0
        run: python scripts/apply-v10.5.py
      - name: Aplicar atualização limpa 10.7.0
        run: python scripts/apply-v10.7.py
      - name: Aplicar refinamento 10.7.1
        run: python scripts/apply-v10.7.1.py
      - name: Verificar JavaScript
        run: node --check app/public/app.js
      - name: Instalar dependências
        working-directory: app
        run: npm install
      - name: Compilar backend
        working-directory: app
        run: npm run build
      - name: Gerar instalador e metadados
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish never
      - name: Publicar Release 10.7.1
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "v10.7.1" --yes 2>$null
          git push origin --delete "v10.7.1" 2>$null
          gh release create "v10.7.1" --target main --title "Eletromix 10.7.1 - Visual renovado e versão no atualizador" --notes "Melhoria visual mais ampla do Eletromix: cabeçalho, menu lateral, cartões, campos, botões, tabelas, modais e detalhes de navegação foram refinados. Remove o texto 'Gestão inteligente para sua loja' do topo e mantém apenas Eletromix. O atualizador agora mostra a versão instalada e, quando houver atualização, exibe também a nova versão disponível ao lado do botão. Mantém a NFC-e dentro de Configurações e todas as funções da 10.7.0."
          Get-ChildItem app/release -File | Where-Object { $_.Name -match '\.(exe|yml|blockmap)$' } | ForEach-Object { gh release upload "v10.7.1" $_.FullName --clobber }
