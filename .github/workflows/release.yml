name: Publicar atualização Eletromix
on:
  push:
    branches:
      - main
    paths:
      - 'release-trigger.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Extrair fonte 10.1.0
        shell: pwsh
        run: |
          if (Test-Path app) { Remove-Item app -Recurse -Force }
          Expand-Archive -Path "Eletromix-v10.1.0-source-for-release.zip" -DestinationPath app
      - name: Aplicar atualização 10.2.0
        run: python scripts/apply-v10.2.py
      - name: Corrigir tipos 10.2.0
        run: python scripts/fix-v10.2-types.py
      - name: Aplicar atualização 10.3.0
        run: python scripts/apply-v10.3.py
      - name: Aplicar atualização 10.4.0
        run: python scripts/apply-v10.4.py
      - name: Aplicar atualização 10.5.0
        run: python scripts/apply-v10.5.py
      - name: Aplicar atualização limpa 10.7.0
        run: python scripts/apply-v10.7.py
      - name: Verificar JavaScript
        run: node --check app/public/app.js
      - name: Instalar dependências
        working-directory: app
        run: npm install
      - name: Compilar backend
        working-directory: app
        run: npm run build
      - name: Gerar instalador e metadados
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish never
      - name: Publicar Release 10.7.0
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "v10.7.0" --yes 2>$null
          git push origin --delete "v10.7.0" 2>$null
          gh release create "v10.7.0" --target main --title "Eletromix 10.7.0 - Interface refinada e NFC-e nas Configurações" --notes "Reconstrução limpa a partir da 10.5, descartando as tentativas 10.6.x que causavam problemas visuais. O NFC-e agora fica dentro de Configurações, sem criar nova coluna ou seção solta no Caixa. Também melhora cartões, botões, campos, navegação e organização visual do sistema. Mantém pagamento parcelado, pagamento misto, exclusão de venda cancelada, dados completos de cliente, produtos faltando informação e dashboard de pendências. A parte NFC-e continua em homologação, sem simular autorização fiscal."
          Get-ChildItem app/release -File | Where-Object { $_.Name -match '\.(exe|yml|blockmap)$' } | ForEach-Object { gh release upload "v10.7.0" $_.FullName --clobber }
