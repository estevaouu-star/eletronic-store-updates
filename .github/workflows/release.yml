name: Publicar atualização Eletromix
on:
  push:
    branches:
      - main
    paths:
      - 'release-trigger.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Extrair fonte 10.1.0
        shell: pwsh
        run: |
          if (Test-Path app) { Remove-Item app -Recurse -Force }
          Expand-Archive -Path "Eletromix-v10.1.0-source-for-release.zip" -DestinationPath app
      - name: Aplicar atualização 10.2.0
        run: python scripts/apply-v10.2.py
      - name: Corrigir tipos 10.2.0
        run: python scripts/fix-v10.2-types.py
      - name: Aplicar atualização 10.3.0
        run: python scripts/apply-v10.3.py
      - name: Aplicar atualização 10.4.0
        run: python scripts/apply-v10.4.py
      - name: Aplicar atualização 10.5.0
        run: python scripts/apply-v10.5.py
      - name: Preparar correção 10.6.0
        run: python scripts/fix-v10.6-patch.py
      - name: Aplicar atualização 10.6.0
        run: python scripts/apply-v10.6.py
      - name: Verificar JavaScript
        run: node --check app/public/app.js
      - name: Instalar dependências
        working-directory: app
        run: npm install
      - name: Compilar backend
        working-directory: app
        run: npm run build
      - name: Gerar instalador e metadados
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish never
      - name: Publicar Release 10.6.0
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "v10.6.0" --yes 2>$null
          git push origin --delete "v10.6.0" 2>$null
          gh release create "v10.6.0" --target main --title "Eletromix 10.6.0 - Módulo NFC-e Homologação" --notes "Adiciona uma aba NFC-e separada do PDV normal, com configuração fiscal da empresa, CSC/ID, regime tributário, série, validação de prontidão, identificação de produtos com dados fiscais pendentes e validação prévia de vendas. Por segurança fiscal, esta versão NÃO transmite nem simula autorização da SEFAZ: a transmissão real será habilitada somente após certificado digital, schemas/assinatura/QR Code e comunicação oficial estarem integrados e testados em homologação."
          Get-ChildItem app/release -File | Where-Object { $_.Name -match '\.(exe|yml|blockmap)$' } | ForEach-Object { gh release upload "v10.6.0" $_.FullName --clobber }
