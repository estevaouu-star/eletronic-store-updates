name: Publicar Eletromix 10.7.5
on:
  push:
    branches: [main]
    paths: ['release-v10.7.5-trigger.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Extrair fonte
        shell: pwsh
        run: |
          if (Test-Path app) { Remove-Item app -Recurse -Force }
          Expand-Archive -Path "Eletromix-v10.1.0-source-for-release.zip" -DestinationPath app
      - name: Aplicar atualizações
        shell: pwsh
        run: |
          python scripts/apply-v10.2.py
          python scripts/fix-v10.2-types.py
          python scripts/apply-v10.3.py
          python scripts/apply-v10.4.py
          python scripts/apply-v10.5.py
          python scripts/apply-v10.7.py
          python scripts/apply-v10.7.1.py
          python scripts/apply-v10.7.2.py
          python scripts/apply-v10.7.3.py
          python scripts/apply-v10.7.4.py
          python scripts/apply-v10.7.5.py
      - name: Aplicar novo ícone Eletromix corretamente
        shell: pwsh
        run: |
          python -c "import base64,pathlib,hashlib,struct; parts=[pathlib.Path(f'assets/eletromix-icon-256.part{i}').read_text(encoding='utf-8').strip() for i in range(1,7)]; data=base64.b64decode(''.join(parts),validate=True); assert hashlib.sha256(data).hexdigest()=='590c99ce1b57214450b83c375377f6bff1092d9615d5e224803b2a56da7d1617'; w,h=struct.unpack('>II',data[16:24]); assert (w,h)==(256,256); pathlib.Path('app/electron/assets/icon.png').write_bytes(data); pathlib.Path('app/public/eletromix-app-icon.png').write_bytes(data); print('Icone Eletromix valido:',w,'x',h,len(data),'bytes')"
      - name: Verificar estrutura e JavaScript
        shell: pwsh
        run: |
          node --check app/public/app.js
          if (-not (Select-String -Path app/public/app.js -Pattern '8\*1024\*1024' -Quiet)) { throw 'Limite novo de imagem não encontrado' }
          if (-not (Select-String -Path app/src/server.ts -Pattern 'aparenciaPorLoja' -Quiet)) { throw 'Aparência por loja não encontrada' }
          if (-not (Select-String -Path app/public/style.css -Pattern 'section>.title' -Quiet)) { throw 'Correção do título não encontrada' }
      - name: Instalar dependências
        working-directory: app
        run: npm install
      - name: Compilar backend
        working-directory: app
        run: npm run build
      - name: Gerar instalador
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish never
      - name: Publicar Release 10.7.5
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "v10.7.5" --yes 2>$null
          git push origin --delete "v10.7.5" 2>$null
          gh release create "v10.7.5" --target main --title "Eletromix 10.7.5 - Correções de personalização" --notes "Corrige os problemas mostrados na tela de Personalização: título alinhado corretamente, logos maiores e sem corte, upload de imagens de até 8 MB com otimização automática, novo ícone Eletromix aplicado também no executável/atalho e no topo do sistema. A personalização agora fica realmente salva separadamente por loja."
          Get-ChildItem app/release -File | Where-Object { $_.Name -match '\.(exe|yml|blockmap)$' } | ForEach-Object { gh release upload "v10.7.5" $_.FullName --clobber }
