name: Publicar Eletromix 10.11.29 - cópia da 10.11.20
on:
  push:
    branches: [main]
    paths: ['release-10.11.29-trigger.txt']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Montar somente até a versão 10.11.20
        shell: pwsh
        run: |
          Expand-Archive -Path "Eletromix-v10.1.0-source-for-release.zip" -DestinationPath app
          $wf=Get-Content '.github/workflows/release-v10.10.51.yml' -Raw
          $m=[regex]::Match($wf,'\$base\s*=\s*@\((.*?)\)',[System.Text.RegularExpressions.RegexOptions]::Singleline)
          if(-not $m.Success){throw 'Lista base não encontrada'}
          $files=[regex]::Matches($m.Groups[1].Value,"'([^']+)'\s*,?")|ForEach-Object {$_.Groups[1].Value}
          foreach($file in $files){python "scripts/$file";if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}}
          foreach($file in @('apply-v10.10.52.py','apply-v10.11.00.py','apply-v10.11.01.py','apply-v10.11.02.py','apply-v10.11.03.py','apply-v10.11.04.py','apply-v10.11.05.py','apply-v10.11.06.py','apply-v10.11.07.py','apply-v10.11.08.py','apply-v10.11.09.py','apply-v10.11.10.py','apply-v10.11.11.py','apply-v10.11.12.py','apply-v10.11.13.py','apply-v10.11.14.py','apply-v10.11.15.py','apply-v10.11.16.py','apply-v10.11.17.py','apply-v10.11.18.py','apply-v10.11.19.py','apply-v10.11.20.py')){python "scripts/$file";if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}}
          Copy-Item app/electron/main.cjs baseline-main.cjs
          Copy-Item app/public/app.js baseline-app.js
          Copy-Item app/public/index.html baseline-index.html
          python scripts/apply-v10.11.29.py
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Provar equivalência com 10.11.20
        shell: pwsh
        run: |
          if((Get-FileHash app/electron/main.cjs).Hash -ne (Get-FileHash baseline-main.cjs).Hash){throw 'main.cjs difere da 10.11.20'}
          $app=(Get-Content app/public/app.js -Raw).Replace('const atual="10.11.29"','const atual="10.11.20"')
          $baseApp=Get-Content baseline-app.js -Raw
          if($app -cne $baseApp){throw 'app.js possui alteração além da versão'}
          $html=(Get-Content app/public/index.html -Raw).Replace('v10.11.29','v10.11.20')
          $baseHtml=Get-Content baseline-index.html -Raw
          if($html -cne $baseHtml){throw 'index.html possui alteração além da versão'}
          $pkg=Get-Content app/package.json -Raw|ConvertFrom-Json
          if($pkg.version -ne '10.11.29'){throw 'Número de versão incorreto'}
          $source=(Get-Content app/electron/main.cjs -Raw)+"
"+(Get-Content app/public/app.js -Raw)+"
"+(Get-Content app/package.json -Raw)
          if($source -match 'pnputil|PrintUIEntry|Add-PrinterDriver|Remove-PrinterDriver'){throw 'Comando de alteração de driver encontrado'}
          node --check app/electron/main.cjs
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          node --check app/public/app.js
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          Write-Host 'CONFIRMADO: código funcional idêntico à 10.11.20; somente versão 10.11.29.'
      - name: Aplicar ícone original da distribuição
        shell: pwsh
        run: python -c "import base64,pathlib; data=base64.b64decode(''.join(pathlib.Path(f'assets/eletromix-icon-256.part{i}').read_text().strip() for i in range(1,7))); pathlib.Path('app/electron/assets/icon.png').write_bytes(data); pathlib.Path('app/public/eletromix-app-icon.png').write_bytes(data)"
      - name: Compilar
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install
          npm run build
          npx electron-builder --win nsis --publish never
      - name: Publicar
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v10.11.29 --yes 2>$null
          gh release create v10.11.29 --target main --title "Eletromix 10.11.29 - restauração integral da 10.11.20" --notes "Código funcional idêntico à 10.11.20. Somente o número foi alterado para 10.11.29. Nenhuma alteração de driver é executada pelo aplicativo." app/release/*.exe app/release/*.yml app/release/*.blockmap
          gh release edit v10.11.29 --latest
