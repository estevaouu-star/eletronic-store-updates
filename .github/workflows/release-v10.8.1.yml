name: Publicar Eletromix 10.8.1
on:
  push:
    branches: [main]
    paths: ['release-v10.8.1-trigger.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Extrair fonte
        shell: pwsh
        run: |
          if (Test-Path app) { Remove-Item app -Recurse -Force }
          Expand-Archive -Path "Eletromix-v10.1.0-source-for-release.zip" -DestinationPath app
      - name: Aplicar atualizações
        shell: pwsh
        run: |
          python scripts/apply-v10.2.py
          python scripts/fix-v10.2-types.py
          python scripts/apply-v10.3.py
          python scripts/apply-v10.4.py
          python scripts/apply-v10.5.py
          python scripts/apply-v10.7.py
          python scripts/apply-v10.7.1.py
          python scripts/apply-v10.7.2.py
          python scripts/apply-v10.7.3.py
          python scripts/apply-v10.7.4.py
          python scripts/apply-v10.7.5.py
          python scripts/apply-v10.7.6.py
          python scripts/apply-v10.7.7.py
          python scripts/apply-v10.7.8.py
          python scripts/apply-v10.7.9.py
          python scripts/apply-v10.8.0.py
          python scripts/apply-v10.8.1.py
      - name: Aplicar ícone Eletromix validado
        shell: pwsh
        run: |
          python -c "import base64,pathlib,hashlib,struct; parts=[pathlib.Path(f'assets/eletromix-icon-256.part{i}').read_text(encoding='utf-8').strip() for i in range(1,7)]; data=base64.b64decode(''.join(parts),validate=True); assert hashlib.sha256(data).hexdigest()=='590c99ce1b57214450b83c375377f6bff1092d9615d5e224803b2a56da7d1617'; w,h=struct.unpack('>II',data[16:24]); assert (w,h)==(256,256); pathlib.Path('app/electron/assets/icon.png').write_bytes(data); pathlib.Path('app/public/eletromix-app-icon.png').write_bytes(data)"
      - name: Validar inicialização e impressão
        shell: pwsh
        run: |
          node --check app/public/app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check app/electron/main.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check app/electron/preload.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String -Path app/electron/main.cjs -SimpleMatch '.Replace("`r"' -Quiet) { throw 'Escape PowerShell inseguro ainda presente' }
          if (-not (Select-String -Path app/electron/main.cjs -SimpleMatch ".Replace([char]13,' ').Replace([char]10,' ')" -Quiet)) { throw 'Hotfix de inicialização ausente' }
          if (-not (Select-String -Path app/electron/main.cjs -Pattern '0x1d,0x56,0x42,0x00' -Quiet)) { throw 'Comando de corte automático ausente' }
          if (-not (Select-String -Path app/electron/main.cjs -Pattern 'RawPrinterFast' -Quiet)) { throw 'Worker persistente de impressão ausente' }
          if (-not (Select-String -Path app/electron/main.cjs -Pattern 'threshold=142' -Quiet)) { throw 'Ajuste de densidade ausente' }
      - name: Instalar dependências
        working-directory: app
        run: npm install
      - name: Compilar backend
        working-directory: app
        run: npm run build
      - name: Gerar instalador
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish never
      - name: Publicar Release 10.8.1
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "v10.8.1" --yes 2>$null
          git push origin --delete "v10.8.1" 2>$null
          gh release create "v10.8.1" --target main --title "Eletromix 10.8.1 - Hotfix de inicialização" --notes "Corrige o erro de JavaScript que impedia a versão 10.8.0 de abrir. Mantém corte automático ESC/POS, logo térmica mais clara e otimizações de velocidade. A validação agora falha imediatamente se o main.cjs tiver qualquer erro de sintaxe."
          Get-ChildItem app/release -File | Where-Object { $_.Name -match '\.(exe|yml|blockmap)$' } | ForEach-Object { gh release upload "v10.8.1" $_.FullName --clobber }
