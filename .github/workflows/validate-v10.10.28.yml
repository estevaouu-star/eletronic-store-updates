name: Validar Cartões de Produtos 10.10.28
on:
  push:
    branches: ['agent/validate-product-cards-10-10-28']
    paths: ['validation-v10.10.28-trigger.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair e aplicar patches
        shell: pwsh
        run: |
          Expand-Archive -Path "Eletromix-v10.1.0-source-for-release.zip" -DestinationPath app
          $files = @('apply-v10.2.py','fix-v10.2-types.py','apply-v10.3.py','apply-v10.4.py','apply-v10.5.py','apply-v10.7.py','apply-v10.7.1.py','apply-v10.7.2.py','apply-v10.7.3.py','apply-v10.7.4.py','apply-v10.7.5.py','apply-v10.7.6.py','apply-v10.7.7.py','apply-v10.7.8.py','apply-v10.7.9.py','apply-v10.8.0.py','apply-v10.8.1.py','apply-v10.8.2.py','apply-v10.8.3.py','apply-v10.8.4.py','fix-v10.8.4-types.py','apply-v10.8.5.py','apply-v10.9.0.py','apply-v10.9.1.py','apply-v10.9.2.py','apply-v10.9.3.py','apply-v10.9.4.py','apply-v10.9.5.py','apply-v10.9.6.py','apply-v10.9.7.py','apply-v10.9.8.py','apply-v10.9.9.py','apply-v10.10.0.py','apply-v10.10.1.py','apply-v10.10.2.py','apply-v10.10.3.py','apply-v10.10.4.py','apply-v10.10.5.py','apply-v10.10.6.py','apply-v10.10.7.py','apply-v10.10.8.py','apply-v10.10.8-fix.py','apply-v10.10.9.py','apply-v10.10.10.py','apply-v10.10.11.py','apply-v10.10.12.py','apply-v10.10.13.py','apply-v10.10.14.py','apply-v10.10.15.py','apply-v10.10.16.py','apply-v10.10.17.py','apply-v10.10.18.py','apply-v10.10.19.py','apply-v10.10.20.py','apply-v10.10.21.py','apply-v10.10.22.py','apply-v10.10.23.py','apply-v10.10.24.py','apply-v10.10.25.py','apply-v10.10.26.py','apply-v10.10.27.py','apply-v10.10.28.py')
          foreach($file in $files){ python "scripts/$file"; if($LASTEXITCODE -ne 0){exit $LASTEXITCODE} }
      - name: Instalar e compilar
        working-directory: app
        run: |
          npm install
          npm run build
      - name: Validar layout compacto e código
        shell: pwsh
        run: |
          node --check app/public/app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check app/electron/main.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $checks = @(
            @{Text='grid-template-columns:64px minmax(0,1fr)'; Error='Foto e texto não estão lado a lado'},
            @{Text='grid-column:1!important;grid-row:1/-1'; Error='Foto não está fixada à esquerda'},
            @{Text='grid-column:2!important'; Error='Textos não estão à direita'},
            @{Text='width:58px!important;height:58px!important;border:0!important'; Error='Foto do perfil 1024x768 não foi ampliada ou ainda tem borda'},
            @{Text='background:transparent!important'; Error='Fundo claro da foto não foi removido'},
            @{Text='object-fit:contain!important'; Error='Imagem pode ficar deformada'}
          )
          foreach($check in $checks){if(-not (Select-String -Path app/public/style.css -Pattern $check.Text -SimpleMatch -Quiet)){throw $check.Error}}
          if(-not (Select-String -Path app/public/app.js -Pattern 'size=tipo==="caixa"?64:40' -SimpleMatch -Quiet)){throw 'Tamanho intrínseco da imagem não foi atualizado'}
          $pkg = Get-Content app/package.json -Raw | ConvertFrom-Json
          if($pkg.version -ne '10.10.28'){throw 'Versão incorreta'}
          if($pkg.build.appId -ne 'com.eletromix.pdv'){throw 'appId mudou e poderia criar outro aplicativo'}
          if(-not $pkg.build.nsis.oneClick -or $pkg.build.nsis.perMachine){throw 'Instalador silencioso por usuário não configurado'}
      - name: Aplicar ícone do instalador
        shell: pwsh
        run: python -c "import base64,pathlib; data=base64.b64decode(''.join(pathlib.Path(f'assets/eletromix-icon-256.part{i}').read_text().strip() for i in range(1,7))); pathlib.Path('app/electron/assets/icon.png').write_bytes(data); pathlib.Path('app/public/eletromix-app-icon.png').write_bytes(data)"
      - name: Gerar instalador de teste
        working-directory: app
        run: npx electron-builder --win nsis --publish never
      - name: Marcar validação aprovada
        if: success()
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -f validation-v10.10.28-passed
          git push origin -f validation-v10.10.28-passed
      - name: Marcar validação reprovada
        if: failure()
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -f validation-v10.10.28-failed
          git push origin -f validation-v10.10.28-failed
