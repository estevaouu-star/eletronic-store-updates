name: Publicar Eletromix 10.8.4
on:
  push:
    branches: [main]
    paths: ['release-v10.8.4-trigger.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Extrair fonte
        shell: pwsh
        run: |
          if (Test-Path app) { Remove-Item app -Recurse -Force }
          Expand-Archive -Path "Eletromix-v10.1.0-source-for-release.zip" -DestinationPath app
      - name: Aplicar atualizações
        shell: pwsh
        run: |
          python scripts/apply-v10.2.py
          python scripts/fix-v10.2-types.py
          python scripts/apply-v10.3.py
          python scripts/apply-v10.4.py
          python scripts/apply-v10.5.py
          python scripts/apply-v10.7.py
          python scripts/apply-v10.7.1.py
          python scripts/apply-v10.7.2.py
          python scripts/apply-v10.7.3.py
          python scripts/apply-v10.7.4.py
          python scripts/apply-v10.7.5.py
          python scripts/apply-v10.7.6.py
          python scripts/apply-v10.7.7.py
          python scripts/apply-v10.7.8.py
          python scripts/apply-v10.7.9.py
          python scripts/apply-v10.8.0.py
          python scripts/apply-v10.8.1.py
          python scripts/apply-v10.8.2.py
          python scripts/apply-v10.8.3.py
          python scripts/apply-v10.8.4.py
          python scripts/fix-v10.8.4-types.py
      - name: Aplicar ícone Eletromix validado
        shell: pwsh
        run: |
          python -c "import base64,pathlib,hashlib,struct; parts=[pathlib.Path(f'assets/eletromix-icon-256.part{i}').read_text(encoding='utf-8').strip() for i in range(1,7)]; data=base64.b64decode(''.join(parts),validate=True); assert hashlib.sha256(data).hexdigest()=='590c99ce1b57214450b83c375377f6bff1092d9615d5e224803b2a56da7d1617'; w,h=struct.unpack('>II',data[16:24]); assert (w,h)==(256,256); pathlib.Path('app/electron/assets/icon.png').write_bytes(data); pathlib.Path('app/public/eletromix-app-icon.png').write_bytes(data)"
      - name: Validar JavaScript e permissões
        shell: pwsh
        run: |
          node --check app/public/app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check app/electron/main.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check app/electron/preload.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path app/src/server.ts -SimpleMatch 'lojaIds?:number[]' -Quiet)) { throw 'Permissões de lojas ausentes no usuário' }
          if (-not (Select-String -Path app/src/server.ts -SimpleMatch 'function lojasPermitidasUsuario' -Quiet)) { throw 'Filtro de lojas permitidas ausente' }
          if (-not (Select-String -Path app/src/server.ts -SimpleMatch 'app.get("/api/usuarios",auth,admin' -Quiet)) { throw 'Gestão de usuários deixou de ser exclusiva do ADM' }
          if (-not (Select-String -Path app/public/app.js -SimpleMatch 'input[name="lojaIds"]' -Quiet)) { throw 'Seleção de lojas por usuário ausente' }
          if (-not (Select-String -Path app/public/app.js -SimpleMatch 'ajustarLojaAoUsuario' -Quiet)) { throw 'Ajuste automático da loja do login ausente' }
          if (-not (Select-String -Path app/public/app.js -SimpleMatch 'requestToken && requestToken===token' -Quiet)) { throw 'Proteção do login 10.8.3 ausente' }
          if (-not (Select-String -Path app/public/app.js -SimpleMatch 'receiptPrintInFlight' -Quiet)) { throw 'Correção de impressão única ausente' }
      - name: Instalar dependências
        working-directory: app
        run: npm install
      - name: Compilar backend
        working-directory: app
        run: npm run build
      - name: Testar login e acesso por loja
        shell: pwsh
        run: |
          $env:ELECTRON_STORE_PORT='32147'
          $env:ELECTRON_STORE_DATA_DIR="$env:RUNNER_TEMP\eletromix-store-access-test"
          if (Test-Path $env:ELECTRON_STORE_DATA_DIR) { Remove-Item $env:ELECTRON_STORE_DATA_DIR -Recurse -Force }
          $proc=Start-Process -FilePath node -ArgumentList 'dist/server.js' -WorkingDirectory 'app' -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 2
            $base='http://127.0.0.1:32147'
            $loginJson = curl.exe -s -X POST "$base/api/login" -H "Content-Type: application/json" -d '{"login":"admin","senha":"admin123"}'
            $adminLogin = $loginJson | ConvertFrom-Json
            if (-not $adminLogin.token) { throw 'ADM não conseguiu entrar' }
            $admToken=$adminLogin.token

            $dutraJson = curl.exe -s -X POST "$base/api/lojas" -H "Authorization: Bearer $admToken" -H "Content-Type: application/json" -d '{"nome":"Loja Dutra"}'
            $dutra=$dutraJson | ConvertFrom-Json
            $centroJson = curl.exe -s -X POST "$base/api/lojas" -H "Authorization: Bearer $admToken" -H "Content-Type: application/json" -d '{"nome":"Loja Centro"}'
            $centro=$centroJson | ConvertFrom-Json
            if (-not $dutra.id -or -not $centro.id) { throw 'Falha ao criar lojas de teste' }

            $bodyDutra = @{nome='Usuário Dutra';login='dutra';senha='teste123';cargo='vendedor';lojaIds=@([int]$dutra.id)} | ConvertTo-Json -Compress
            $novoDutraJson = curl.exe -s -X POST "$base/api/usuarios" -H "Authorization: Bearer $admToken" -H "Content-Type: application/json" -d $bodyDutra
            $novoDutra=$novoDutraJson | ConvertFrom-Json
            if ($novoDutra.lojaIds.Count -ne 1 -or [int]$novoDutra.lojaIds[0] -ne [int]$dutra.id) { throw 'Permissão de uma loja não foi salva' }

            $loginDutraJson = curl.exe -s -X POST "$base/api/login" -H "Content-Type: application/json" -d '{"login":"dutra","senha":"teste123"}'
            $loginDutra=$loginDutraJson | ConvertFrom-Json
            if (-not $loginDutra.token) { throw 'Usuário Dutra não conseguiu entrar' }
            $dutraToken=$loginDutra.token
            $lojasDutraJson = curl.exe -s "$base/api/lojas" -H "Authorization: Bearer $dutraToken"
            $lojasDutra=@($lojasDutraJson | ConvertFrom-Json)
            if ($lojasDutra.Count -ne 1 -or [int]$lojasDutra[0].id -ne [int]$dutra.id) { throw 'Usuário Dutra conseguiu enxergar loja não autorizada' }
            $usuariosStatus = curl.exe -s -o NUL -w "%{http_code}" "$base/api/usuarios" -H "Authorization: Bearer $dutraToken"
            if ($usuariosStatus -ne '403') { throw "Vendedor acessou gestão de login: HTTP $usuariosStatus" }

            $bodyMulti = @{nome='Usuário Multi';login='multi';senha='teste123';cargo='vendedor';lojaIds=@([int]$dutra.id,[int]$centro.id)} | ConvertTo-Json -Compress
            $novoMultiJson = curl.exe -s -X POST "$base/api/usuarios" -H "Authorization: Bearer $admToken" -H "Content-Type: application/json" -d $bodyMulti
            $novoMulti=$novoMultiJson | ConvertFrom-Json
            if ($novoMulti.lojaIds.Count -ne 2) { throw 'Permissão de múltiplas lojas não foi salva' }
            $loginMultiJson = curl.exe -s -X POST "$base/api/login" -H "Content-Type: application/json" -d '{"login":"multi","senha":"teste123"}'
            $loginMulti=$loginMultiJson | ConvertFrom-Json
            if (-not $loginMulti.token) { throw 'Usuário multi não conseguiu entrar' }
            $lojasMultiJson = curl.exe -s "$base/api/lojas" -H "Authorization: Bearer $($loginMulti.token)"
            $lojasMulti=@($lojasMultiJson | ConvertFrom-Json)
            if ($lojasMulti.Count -ne 2) { throw 'Usuário multi não recebeu exatamente duas lojas' }

            $selfEditBody = @{login='admin-geral';nome='Administrador Geral';cargo='admin';ativo=$true;lojaIds=@()} | ConvertTo-Json -Compress
            $selfEditJson = curl.exe -s -X PUT "$base/api/usuarios/1" -H "Authorization: Bearer $admToken" -H "Content-Type: application/json" -d $selfEditBody
            $selfEdit=$selfEditJson | ConvertFrom-Json
            if ($selfEdit.login -ne 'admin-geral') { throw 'ADM não conseguiu alterar o próprio login' }
            Write-Host 'Permissões por loja validadas: ADM, uma loja e múltiplas lojas OK.'
          } finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }
      - name: Gerar instalador
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish never
      - name: Publicar Release 10.8.4
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "v10.8.4" --yes 2>$null
          git push origin --delete "v10.8.4" 2>$null
          gh release create "v10.8.4" --target main --title "Eletromix 10.8.4 - Acesso por loja" --notes "Somente administradores podem criar ou alterar logins, inclusive o próprio acesso. Cada vendedor pode ser vinculado a uma única loja ou a várias lojas, e o seletor do Eletromix mostra somente as unidades liberadas para aquele login. Administradores têm acesso automático a todas as lojas. A visão de todas as lojas e relatórios consolidados também respeitam as permissões. Mantém as correções de login da 10.8.3 e de impressão única."
          Get-ChildItem app/release -File | Where-Object { $_.Name -match '\.(exe|yml|blockmap)$' } | ForEach-Object { gh release upload "v10.8.4" $_.FullName --clobber }
