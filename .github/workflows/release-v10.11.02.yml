name: Publicar Eletromix 10.11.02 em Releases
on:
  push:
    branches: [main]
    paths: ['release-10.11.02-trigger.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirmar validação aprovada
        shell: pwsh
        run: |
          git fetch --tags --force
          if(-not (git tag --points-at HEAD | Select-String 'validation-v10.11.02-passed' -Quiet)){throw 'Validação não associada ao código publicado'}
      - name: Extrair e aplicar patches
        shell: pwsh
        run: |
          Expand-Archive -Path "Eletromix-v10.1.0-source-for-release.zip" -DestinationPath app
          $wf = Get-Content '.github/workflows/release-v10.10.51.yml' -Raw
          $m = [regex]::Match($wf, '\$base\s*=\s*@\((.*?)\)', [System.Text.RegularExpressions.RegexOptions]::Singleline)
          if(-not $m.Success){ throw 'Lista validada da 10.10.51 não encontrada' }
          $files = [regex]::Matches($m.Groups[1].Value, "'([^']+)'\s*,?") | ForEach-Object { $_.Groups[1].Value }
          foreach($file in $files){ python "scripts/$file"; if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE } }
          foreach($file in @('apply-v10.10.52.py','apply-v10.11.00.py','apply-v10.11.01.py','apply-v10.11.02.py')){ python "scripts/$file"; if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE } }
      - name: Aplicar ícone
        shell: pwsh
        run: python -c "import base64,pathlib; data=base64.b64decode(''.join(pathlib.Path(f'assets/eletromix-icon-256.part{i}').read_text().strip() for i in range(1,7))); pathlib.Path('app/electron/assets/icon.png').write_bytes(data); pathlib.Path('app/public/eletromix-app-icon.png').write_bytes(data)"
      - name: Instalar, compilar e validar
        working-directory: app
        run: |
          npm install
          npm run build
          node --check public/app.js
          node --check electron/main.cjs
          node --check electron/preload.cjs
      - name: Gerar instalador
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish never
      - name: Publicar
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v10.11.02 --target main --title "Eletromix 10.11.02 - Banco otimizado" --notes "Migra a sincronização do Supabase para o banco integrado do Eletromix. Remove consultas automáticas repetitivas, verifica apenas a versão dos dados e baixa o conteúdo completo somente quando houver alteração. O botão Sincronizar continua disponível e as alterações salvas são enviadas imediatamente." app/release/*.exe app/release/*.yml app/release/*.blockmap
          gh release edit v10.11.02 --latest
