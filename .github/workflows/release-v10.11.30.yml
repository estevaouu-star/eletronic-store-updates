name: Publicar Eletromix 10.11.30 - acessos e modo leve
on:
  push:
    branches: [main]
    paths: ['release-10.11.30-trigger.txt']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Montar sobre a restauração funcional
        shell: pwsh
        run: |
          Expand-Archive -Path "Eletromix-v10.1.0-source-for-release.zip" -DestinationPath app
          $wf=Get-Content '.github/workflows/release-v10.10.51.yml' -Raw
          $m=[regex]::Match($wf,'\$base\s*=\s*@\((.*?)\)',[System.Text.RegularExpressions.RegexOptions]::Singleline)
          if(-not $m.Success){throw 'Lista base não encontrada'}
          $files=[regex]::Matches($m.Groups[1].Value,"'([^']+)'\s*,?")|ForEach-Object {$_.Groups[1].Value}
          foreach($file in $files){python "scripts/$file";if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}}
          foreach($file in @('apply-v10.10.52.py','apply-v10.11.00.py','apply-v10.11.01.py','apply-v10.11.02.py','apply-v10.11.03.py','apply-v10.11.04.py','apply-v10.11.05.py','apply-v10.11.06.py','apply-v10.11.07.py','apply-v10.11.08.py','apply-v10.11.09.py','apply-v10.11.10.py','apply-v10.11.11.py','apply-v10.11.12.py','apply-v10.11.13.py','apply-v10.11.14.py','apply-v10.11.15.py','apply-v10.11.16.py','apply-v10.11.17.py','apply-v10.11.18.py','apply-v10.11.19.py','apply-v10.11.20.py','apply-v10.11.29.py')){python "scripts/$file";if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}}
          Copy-Item app/electron/main.cjs baseline-main.cjs
          python scripts/apply-v10.11.30.py
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Validar impressão e papéis
        shell: pwsh
        run: |
          if((Get-FileHash app/electron/main.cjs).Hash -ne (Get-FileHash baseline-main.cjs).Hash){throw 'Motor de impressão foi alterado'}
          $pkg=Get-Content app/package.json -Raw|ConvertFrom-Json
          if($pkg.version -ne '10.11.30'){throw 'Versão incorreta'}
          node --check app/electron/main.cjs
          node --check app/public/app.js
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          if(-not (Select-String app/src/server.ts -Pattern 'return primeira?[primeira]:[]' -SimpleMatch -Quiet)){throw 'Regra de loja única ausente'}
          if(-not (Select-String app/public/style.css -Pattern 'performance-lite-101025' -SimpleMatch -Quiet)){throw 'Modo leve ausente'}
      - name: Aplicar ícone
        shell: pwsh
        run: python -c "import base64,pathlib; data=base64.b64decode(''.join(pathlib.Path(f'assets/eletromix-icon-256.part{i}').read_text().strip() for i in range(1,7))); pathlib.Path('app/electron/assets/icon.png').write_bytes(data); pathlib.Path('app/public/eletromix-app-icon.png').write_bytes(data)"
      - name: Compilar e testar
        working-directory: app
        run: |
          npm install
          npm run build
      - name: Testar acesso por loja
        shell: pwsh
        run: node scripts/test-v10.11.30-access.mjs
      - name: Gerar instalador
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish never
      - name: Publicar
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v10.11.30 --yes 2>$null
          gh release create v10.11.30 --target main --title "Eletromix 10.11.30 - acessos claros e modo leve" --notes "Administrador transita entre todas as lojas. Vendedor fica vinculado a uma única loja e mantém as funções operacionais. Layout compacto e modo leve reforçado para PCs antigos. Motor de impressão idêntico à 10.11.20." app/release/*.exe app/release/*.yml app/release/*.blockmap
          gh release edit v10.11.30 --latest
