name: Publicar Eletromix 10.9.9
on:
  push:
    branches: [main]
    paths: ['release-v10.9.9-trigger.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair fonte
        shell: pwsh
        run: Expand-Archive -Path "Eletromix-v10.1.0-source-for-release.zip" -DestinationPath app
      - name: Aplicar patches
        shell: pwsh
        run: |
          python scripts/apply-v10.2.py
          python scripts/fix-v10.2-types.py
          python scripts/apply-v10.3.py
          python scripts/apply-v10.4.py
          python scripts/apply-v10.5.py
          python scripts/apply-v10.7.py
          python scripts/apply-v10.7.1.py
          python scripts/apply-v10.7.2.py
          python scripts/apply-v10.7.3.py
          python scripts/apply-v10.7.4.py
          python scripts/apply-v10.7.5.py
          python scripts/apply-v10.7.6.py
          python scripts/apply-v10.7.7.py
          python scripts/apply-v10.7.8.py
          python scripts/apply-v10.7.9.py
          python scripts/apply-v10.8.0.py
          python scripts/apply-v10.8.1.py
          python scripts/apply-v10.8.2.py
          python scripts/apply-v10.8.3.py
          python scripts/apply-v10.8.4.py
          python scripts/fix-v10.8.4-types.py
          python scripts/apply-v10.8.5.py
          python scripts/apply-v10.9.0.py
          python scripts/apply-v10.9.1.py
          python scripts/apply-v10.9.2.py
          python scripts/apply-v10.9.3.py
          python scripts/apply-v10.9.4.py
          python scripts/apply-v10.9.5.py
          python scripts/apply-v10.9.6.py
          python scripts/apply-v10.9.7.py
          python scripts/apply-v10.9.8.py
          python scripts/apply-v10.9.9.py
      - name: Aplicar ícone
        shell: pwsh
        run: python -c "import base64,pathlib; data=base64.b64decode(''.join(pathlib.Path(f'assets/eletromix-icon-256.part{i}').read_text().strip() for i in range(1,7))); pathlib.Path('app/electron/assets/icon.png').write_bytes(data); pathlib.Path('app/public/eletromix-app-icon.png').write_bytes(data)"
      - name: Validar 10.9.9
        shell: pwsh
        run: |
          node --check app/public/app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check app/electron/main.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path 'app/public/index.html' -Pattern 'loginUpdateButton' -SimpleMatch -Quiet)) { throw 'Botao Atualizar no login ausente' }
          if (-not (Select-String -Path 'app/public/app.js' -Pattern "!n.closest('#caixa')" -SimpleMatch -Quiet)) { throw 'Protecao do Caixa ausente' }
      - name: Instalar e compilar
        working-directory: app
        run: |
          npm install
          npm run build
      - name: Gerar instalador
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish never
      - name: Publicar
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference='Continue'
          gh release delete v10.9.9 --yes 2>$null
          git push origin --delete v10.9.9 2>$null
          $created=$false
          for($i=1;$i -le 8;$i++){
            gh release create v10.9.9 --target main --title "Eletromix 10.9.9 - Atualização no login" --notes "Corrige o crash após login e adiciona botão Atualizar na tela de login para permitir atualização mesmo quando a autenticação ou a interface principal estiver com problema."
            if($LASTEXITCODE -eq 0){$created=$true;break}
            Start-Sleep -Seconds (5*$i)
          }
          if(-not $created){throw 'Nao foi possivel criar a release'}
          Get-ChildItem app/release -File | Where-Object { $_.Name -match '\.(exe|yml|blockmap)$' } | ForEach-Object {
            $ok=$false
            for($i=1;$i -le 8;$i++){
              gh release upload v10.9.9 $_.FullName --clobber
              if($LASTEXITCODE -eq 0){$ok=$true;break}
              Start-Sleep -Seconds (5*$i)
            }
            if(-not $ok){throw "Falha no upload: $($_.Name)"}
          }
