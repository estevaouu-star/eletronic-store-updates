name: Inspecionar UI 10.9.2
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['inspect-ui-1092-trigger.txt']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair e localizar estruturas
        shell: bash
        run: |
          unzip -q Eletromix-v10.1.0-source-for-release.zip -d app
          echo '=== JS renderBuscaProdutos ==='
          sed -n '258,305p' app/public/app.js
          echo '=== JS renderProdutos/listeners ==='
          sed -n '395,405p' app/public/app.js
          sed -n '995,1007p' app/public/app.js
