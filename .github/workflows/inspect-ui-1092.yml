name: Inspecionar UI 10.9.2
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['inspect-ui-1092-trigger.txt']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair e localizar estruturas
        shell: bash
        run: |
          unzip -q Eletromix-v10.1.0-source-for-release.zip -d app
          echo '=== HTML Caixa ==='
          sed -n '45,90p' app/public/index.html
          echo '=== HTML Produtos ==='
          sed -n '100,112p' app/public/index.html
          echo '=== JS renderCaixa/produtos ==='
          grep -nEi 'renderBuscaProdutos|renderCart|listaProdutos|listaServicos|renderProdutos' app/public/app.js | head -180 || true
          echo '=== CSS layout ==='
          grep -nEi 'sidebar|nav|\.layout|main\{|aside\{' app/public/style.css | head -180 || true
