name: Inspecionar UI 10.9.4
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['inspect-ui-1092-trigger.txt']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspecionar Caixa e fluxo de caixa
        shell: bash
        run: |
          unzip -q Eletromix-v10.1.0-source-for-release.zip -d app
          echo '=== HTML CAIXA COMPLETO ==='
          sed -n '38,104p' app/public/index.html
          echo '=== FUNCOES CAIXA ==='
          grep -nEi 'loadCaixa|abrirCaixa|fecharCaixa|caixaAtual|/api/caixa|caixaGestao' app/public/app.js | head -120 || true
          echo '=== BACKEND CAIXA ==='
          grep -nEi '/api/caixa|caixa.*aberto|abrir.*caixa|fechar.*caixa' app/src/server.ts | head -160 || true
