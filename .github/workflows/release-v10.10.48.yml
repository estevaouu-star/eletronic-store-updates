name: Publicar Eletromix 10.10.48 em Releases
on:
  push:
    branches: [main]
    paths: ['release-10.10.48-trigger.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair fonte
        shell: pwsh
        run: Expand-Archive -Path "Eletromix-v10.1.0-source-for-release.zip" -DestinationPath app
      - name: Aplicar patches anteriores e 10.10.48
        shell: pwsh
        run: |
          $wf = Get-Content '.github/workflows/release-v10.10.47.yml' -Raw
          $m = [regex]::Match($wf, '\$ordered\s*=\s*@\((.*?)\)', [System.Text.RegularExpressions.RegexOptions]::Singleline)
          if(-not $m.Success){ throw 'Lista de patches 10.10.47 não encontrada' }
          $files = [regex]::Matches($m.Groups[1].Value, "'([^']+)'\s*,?") | ForEach-Object { $_.Groups[1].Value }
          foreach($file in $files){ python "scripts/$file"; if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE } }
          python scripts/apply-v10.10.48.py
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
      - name: Validar
        shell: pwsh
        run: |
          node --check app/public/app.js
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $pkg=Get-Content app/package.json -Raw | ConvertFrom-Json
          if($pkg.version -ne '10.10.48'){throw 'Versão incorreta'}
      - name: Aplicar ícone
        shell: pwsh
        run: python -c "import base64,pathlib; data=base64.b64decode(''.join(pathlib.Path(f'assets/eletromix-icon-256.part{i}').read_text().strip() for i in range(1,7))); pathlib.Path('app/electron/assets/icon.png').write_bytes(data); pathlib.Path('app/public/eletromix-app-icon.png').write_bytes(data)"
      - name: Instalar e compilar
        working-directory: app
        run: |
          npm install
          npm run build
      - name: Gerar instalador
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish never
      - name: Publicar
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v10.10.48 --yes 2>$null
          gh release create v10.10.48 --target main --title "Eletromix 10.10.48 - Impressão corrigida" --notes "Corrige de verdade a via do cliente e da loja aplicando fonte maior e mais grossa diretamente nos elementos reais da impressão. A via de garantia permanece inalterada." app/release/*.exe app/release/*.yml app/release/*.blockmap
          gh release edit v10.10.48 --latest
