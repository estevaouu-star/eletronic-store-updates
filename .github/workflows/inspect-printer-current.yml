name: Inspecionar impressão térmica atual
on:
  push:
    branches: [main]
    paths: ['inspect-printer-trigger.txt']
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Montar fonte atual
        run: |
          rm -rf app
          unzip -q Eletromix-v10.1.0-source-for-release.zip -d app
          python scripts/apply-v10.2.py
          python scripts/fix-v10.2-types.py
          python scripts/apply-v10.3.py
          python scripts/apply-v10.4.py
          python scripts/apply-v10.5.py
          python scripts/apply-v10.7.py
          python scripts/apply-v10.7.1.py
          python scripts/apply-v10.7.2.py
          python scripts/apply-v10.7.3.py
          python scripts/apply-v10.7.4.py
          python scripts/apply-v10.7.5.py
          python scripts/apply-v10.7.6.py
          python scripts/apply-v10.7.7.py
          python scripts/apply-v10.7.8.py
      - name: Mostrar código de impressão
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('app/electron/main.cjs').read_text(encoding='utf-8')
          for needle in ['function receiptPrintHtml','ipcMain.handle("printer:print"']:
              i=s.find(needle)
              print('\n===== '+needle+' =====')
              print(s[max(0,i-1200):i+9000] if i>=0 else 'NAO ENCONTRADO')
          PY
      - name: Mostrar payload de impressão
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('app/public/app.js').read_text(encoding='utf-8')
          for needle in ['function receiptPrintPayload','function directPrintReceipt','function printTestReceipt']:
              i=s.find(needle)
              print('\n===== '+needle+' =====')
              print(s[max(0,i-800):i+5000] if i>=0 else 'NAO ENCONTRADO')
          PY
